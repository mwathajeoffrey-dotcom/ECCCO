<!-- ECCCO Medical App Icon - Simple Version for Small Sizes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E3A8A"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="88" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Medical cross -->
  <g transform="translate(96,96)">
    <rect x="-32" y="-8" width="64" height="16" rx="8" fill="white"/>
    <rect x="-8" y="-32" width="16" height="64" rx="8" fill="white"/>
  </g>
  
  <!-- Simple heartbeat line -->
  <path d="M40,130 L60,130 L68,115 L72,145 L76,120 L80,130 L152,130" 
        stroke="#EF4444" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Highlight -->
  <ellipse cx="70" cy="60" rx="15" ry="25" fill="rgba(255,255,255,0.3)" transform="rotate(-30 70 60)"/>
</svg>